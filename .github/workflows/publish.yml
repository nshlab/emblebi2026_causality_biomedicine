# Render the site from the committed `_freeze/` cache and deploy to GitHub
# Pages. R code is not re-run in CI, but Quarto's knitr post-processing (used
# for the PDF and code links) needs R with a few packages. Re-render locally
# and commit `_freeze/` whenever R code changes.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENV_ACTIVATE_PROJECT: false   # skip the .Rprofile's renv: CI needs only the packages below
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true   # for the PDF version
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 4.5.2   # the course VM's R (renv.lock), with binaries on P3M
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::rmarkdown, any::knitr, any::downlit, any::xml2
      # instructor build (with solutions), as HTML and PDF; use
      # `--profile students` (and path: _site_students) to hide the solutions
      - run: quarto render
      # the book's PDF pass deletes the last chapter's HTML figures from the
      # output; re-render that chapter's HTML (from the freeze) to restore them
      - run: quarto render chapters/sve.qmd --to html --use-freezer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
