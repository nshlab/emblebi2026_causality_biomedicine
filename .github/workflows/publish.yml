# Render the site from the committed `_freeze/` cache (no R needed on the
# runner) and deploy to GitHub Pages. Re-render locally and commit `_freeze/`
# whenever R code changes.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true   # for the PDF version
      # participant build (solutions hidden), as HTML and PDF; use
      # `quarto render` (and path: _site) to publish the solutions instead
      - run: quarto render --profile students
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_students
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
