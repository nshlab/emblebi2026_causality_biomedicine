# Render the site from the committed `_freeze/` cache and deploy to GitHub
# Pages. R code is not re-run in CI, but Quarto's knitr post-processing (used
# for the PDF and code links) needs R with a few packages. Re-render locally
# and commit `_freeze/` whenever R code changes.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RENV_ACTIVATE_PROJECT: false   # skip the .Rprofile's renv: CI needs only the packages below
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true   # for the PDF version
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::rmarkdown, any::knitr, any::downlit, any::xml2
      # participant build (solutions hidden), as HTML and PDF; use
      # `quarto render` (and path: _site) to publish the solutions instead
      - run: quarto render --profile students
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_students
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
